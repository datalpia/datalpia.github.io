name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      SITE_URL: datalpia.com
    outputs:
      site_url: ${{ steps.output_step.outputs.site_url }}

    steps:
      - uses: actions/checkout@v5
      - name: Build package
        run: |
          mkdir -p dist
          cp -R static dist/.
          cp index.html dist/.
          echo "${SITE_URL}" > dist/CNAME
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist
          include-hidden-files: true
      - id: output_step
        run: echo "site_url=${SITE_URL}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: website
      url: ${{ needs.build.outputs.site_url }}
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build
          path: dist
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
